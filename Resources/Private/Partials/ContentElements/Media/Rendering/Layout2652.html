<div class="ch-item ch-item-{data.layout} ch-img-{data.layout} ch-style{data.layout}" style="background-image: url('{f:render(partial: 'Media/Rendering/BackgroundUrl', arguments: _all) -> f:spaceless()}');">

        <f:render partial="Media/Rendering/ChInfoContent" arguments="{file: file, data: data, settings: settings}" />

</html>
