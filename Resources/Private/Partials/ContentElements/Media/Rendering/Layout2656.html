<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>Style #6</f:comment>
<div class="ch-item-{data.layout} ch-img" style="background-image: url('{f:render(partial: 'Media/Rendering/BackgroundUrl', arguments: _all) -> f:spaceless()}');">
    <div class="ch-info-wrap-{data.layout} ">
        <div class="ch-info-{data.layout} ch-info">
            <div class="ch-info-front-{data.layout}  ch-img" style="background-image: url('{f:render(partial: 'Media/Rendering/BackgroundUrl', arguments: _all) -> f:spaceless()}');"></div>
            <div class="ch-info-back-{data.layout} ">
                <f:render partial="Media/Rendering/ChInfoContent" arguments="{file: file, data: data, settings: settings}" />
            </div>
        </div>
    </div>
</div>
<f:render partial="Media/Rendering/ExternalFigcaption" arguments="{file: file, data: data, settings: settings}" />
</html>
