# Rollovercollection 2 - CIRCLE: site settings (Site Management > Settings).
# Every setting is also available as TypoScript constant with the same key.
# Keep the defaults in sync with Configuration/TypoScript/constants.typoscript.
categories:
  Rollovercollection2:
    label: 'Rollovercollection 2 - CIRCLE'
  Rollovercollection2.general:
    label: 'General'
    parent: Rollovercollection2
  Rollovercollection2.common:
    label: 'Common settings'
    parent: Rollovercollection2
  Rollovercollection2.style1:
    label: 'Style#1 settings'
    parent: Rollovercollection2
  Rollovercollection2.style2:
    label: 'Style#2 settings'
    parent: Rollovercollection2
  Rollovercollection2.style3:
    label: 'Style#3 settings'
    parent: Rollovercollection2
  Rollovercollection2.style4:
    label: 'Style#4 settings'
    parent: Rollovercollection2
  Rollovercollection2.style5:
    label: 'Style#5 settings'
    parent: Rollovercollection2
  Rollovercollection2.style6:
    label: 'Style#6 settings'
    parent: Rollovercollection2
  Rollovercollection2.style7:
    label: 'Style#7 settings'
    parent: Rollovercollection2

settings:

  plugin.tx_rollovercollection2_rollovereffect2.view.scssPath:
    label: 'Path to the SCSS folder'
    description: 'Folder containing theme.scss, with trailing slash. Change it only to use your own copy of the theme.'
    category: Rollovercollection2.general
    type: string
    default: 'EXT:rollovercollection2/Resources/Public/Scss/Theme/'

  plugin.tx_rollovercollection2_rollovereffect2.settings.titleRawdataOutput:
    label: 'Title: keep HTML typed by editors'
    description: 'On: HTML in the image title is kept and cleaned by the TYPO3 HTML sanitizer. Off: plain text only.'
    category: Rollovercollection2.general
    type: bool
    default: false

  plugin.tx_rollovercollection2_rollovereffect2.settings.captionRawdataOutput:
    label: 'Caption: keep HTML typed by editors'
    description: 'On: HTML in the image description is kept and cleaned by the TYPO3 HTML sanitizer. Off: plain text only.'
    category: Rollovercollection2.general
    type: bool
    default: false

  plugin.tx_rollovercollection2_rollovereffect2.settings.showMoreLink:
    label: 'Show the "more" link'
    description: 'On: a "more" link is shown inside the circle. Off: the whole circle is linked.'
    category: Rollovercollection2.general
    type: bool
    default: true

  plugin.tx_rollovercollection2_rollovereffect2.settings.imageMaxWidth:
    label: 'Maximum image width in pixels for styles #1 and #2'
    description: 'Styles #1 and #2 scale the background image with CSS, so a smaller file looks the same. 0 = deliver the original file. Styles #3-#7 always use the original file (see README).'
    category: Rollovercollection2.general
    type: int
    default: 800

  plugin.bootstrap_package.settings.scss.rollover2-brand-primary:
    label: '$rollover2-brand-primary'
    description: 'Base color for all effects'
    category: Rollovercollection2.common
    type: string
    default: '$primary'

  plugin.bootstrap_package.settings.scss.rollover2-style1-iconsize:
    label: '$rollover2-style1-iconsize'
    description: 'Circle width/height (140-280px)'
    category: Rollovercollection2.style1
    type: string
    default: '180px'

  plugin.bootstrap_package.settings.scss.rollover2-style1-showcaption:
    label: '$rollover2-style1-showcaption'
    description: 'Display or not the outside caption'
    category: Rollovercollection2.style1
    type: string
    enum:
      'none': 'none'
      'block': 'block'
    default: 'none'

  plugin.bootstrap_package.settings.scss.rollover2-style1-insetboxshadow:
    label: '$rollover2-style1-insetboxshadow'
    description: 'Inset box shadow color'
    category: Rollovercollection2.style1
    type: string
    default: 'rgba(128,255,255,0.6)'

  plugin.bootstrap_package.settings.scss.rollover2-style1-hoverbg:
    label: '$rollover2-style1-hoverbg'
    description: 'Mask hover bg'
    category: Rollovercollection2.style1
    type: string
    default: 'rgba(63,147,147, 0.8)'

  plugin.bootstrap_package.settings.scss.rollover2-style1-titlecolor:
    label: '$rollover2-style1-titlecolor'
    description: 'Title (heading) color'
    category: Rollovercollection2.style1
    type: string
    default: '#fff'

  plugin.bootstrap_package.settings.scss.rollover2-style1-textcolor:
